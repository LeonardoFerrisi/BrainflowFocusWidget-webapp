appId: com.brainflow.focuswidget
productName: BrainFlow Focus Widget
asar: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
  - "!server/**/*"
  - "!electron/**/*"
  - "!src/**/*"
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
