appId: com.brainflow.focuswidget
productName: BrainFlow Focus Widget
# BrainFlow builds its DLL paths as raw __dirname strings and hands them to the
# OS loader via koffi, which cannot read out of an app.asar archive - keep the
# app tree unpacked.
asar: false
afterPack: build/afterPack.cjs
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/**/*.md"
  - "!node_modules/**/*.ts"
  - "!node_modules/**/*.map"
  - "!server/**/*"
  - "!electron/**/*"
  - "!src/**/*"
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: BrainFlowFocusWidget-${version}-Setup.exe
